# Foundation only: seeding and migrations are not wired yet (Krish, phase 0/1).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood
      POSTGRES_DB: dogfood
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood"]
      interval: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://dogfood:dogfood@db:5432/dogfood
    ports: ["8080:8080"]
volumes:
  pgdata:
